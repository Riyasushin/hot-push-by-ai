# Self-hosted RSSHub for ai-radar.
#
# Why: rsshub.app (the public instance) is now behind Cloudflare bot challenge
# (verified 2026-05-07). Every route returns 403 to non-browser clients.
# Self-hosting bypasses that.
#
# Bring up:
#     docker compose -f infra/rsshub.docker-compose.yml up -d
#
# Verify:
#     curl -sI http://localhost:1200/                          # → 200
#     curl -s  http://localhost:1200/zhihu/people/activities/yibozhu | head -c 200
#
# Update the project to use it (one-shot, idempotent):
#     bash scripts/rsshub-rewrite.sh http://localhost:1200
#
# Rotate Zhihu cookie when scraping starts to fail (every few weeks):
#     edit infra/rsshub.env  (ZHIHU_COOKIES=...)
#     docker compose -f infra/rsshub.docker-compose.yml up -d --force-recreate

services:
  rsshub:
    image: diygod/rsshub:chromium-bundled
    container_name: ai-radar-rsshub
    restart: unless-stopped
    # Bind to an unusual high port (less collision with common dev ports
    # like 1200/3000/8080). Loopback only — RSSHub has no auth by default.
    ports:
      - "127.0.0.1:41200:1200"
    env_file:
      - rsshub.env
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      CACHE_EXPIRE: 600          # 10 min — matches our fetch cadence
      REDIS_URL: redis://rsshub-redis:6379/
      REQUEST_RETRY: 2
      REQUEST_TIMEOUT: 8000
      LOGGER_LEVEL: info
    depends_on:
      - rsshub-redis
    # diygod/rsshub uses node:alpine which has no wget/curl. Use node itself
    # to probe the local port — works without adding dependencies.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:1200/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 60s
      timeout: 5s
      retries: 3

  rsshub-redis:
    image: redis:7-alpine
    container_name: ai-radar-rsshub-redis
    restart: unless-stopped
    volumes:
      - rsshub-redis-data:/data

volumes:
  rsshub-redis-data:
