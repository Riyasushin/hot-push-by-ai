[project]
name = "ai-radar"
version = "0.1.0"
description = "Personal AI/econ news aggregator — a fork of AIHOT's design tuned for an AI infra researcher."
requires-python = ">=3.11"
dependencies = [
    "feedparser~=6.0",
    "httpx[socks]~=0.27",   # [socks] for SOCKS proxy support if env has all_proxy
    "typer~=0.12",
    "rich~=13.0",
    "fastapi~=0.115",
    "uvicorn[standard]~=0.32",
    "jinja2~=3.1",
    "python-multipart~=0.0.20",   # for FastAPI Form() in /feedback POST
]

[project.scripts]
radar = "ai_radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_radar"]
