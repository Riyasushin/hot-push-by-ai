# ================================
# T2 — 学术 (3 个 arXiv 主题)
# ================================
# 2026-05-07: arXiv 降级 T1→T2.
# 原因：arXiv 是预印本，未经同行评审，"可行度"不稳；标题党、噪声、re-submit 充斥；
# 当 T1 等价于 OpenAI/DeepMind 官方发布时它的可信度对不上。
# 实务影响：T2 multiplier=1.0, T1 multiplier=1.2 — 同样的 4 维分数下 arXiv 更难
# 进精选, 需要 hardcore/density 等绝对值更高才上得来 (这正是想要的).

